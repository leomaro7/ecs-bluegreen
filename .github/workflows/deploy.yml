name: deploy

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: ecs-bluegreen
  ECS_CLUSTER: ecs-bluegreen
  ECS_SERVICE: ecs-bluegreen
  TASK_FAMILY: ecs-bluegreen
  CONTAINER_NAME: app
  DESIRED_COUNT: 2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE" app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      # Terraform は desired_count = 0 でサービスを作る。
      # 新しいタスク定義と台数を同時に渡すと、Blue/Green 中は旧リビジョン（起動できない初回の枠）も
      # 同じ台数で起動しようとして失敗を繰り返すので、初回は「0 台のまま切り替え → 台数を上げる」の 2 段階にする
      - id: count
        run: |
          current=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' --output text)
          if [ "$current" = "0" ]; then echo "initial=true" >> "$GITHUB_OUTPUT"; fi

      # UpdateService を呼ぶだけで、サービス側の BLUE_GREEN 設定に従って切り替わる
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      - name: Scale out (first deploy only)
        if: steps.count.outputs.initial == 'true'
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --desired-count "$DESIRED_COUNT" --query 'service.desiredCount' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
